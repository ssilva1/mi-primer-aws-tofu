name: 'OpenTofu AWS Deployment'

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Requerido para pedir la clave temporal OIDC a AWS
  contents: read  # Requerido para leer el código del repositorio

jobs:
  opentofu:
    name: 'Tofu Plan and Apply'
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código de tu repositorio en el servidor de GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Conecta GitHub con AWS usando OIDC de forma segura
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::040949441765:role/rol-github-actions-tofu # REEMPLAZA CON TU ARN REAL
        aws-region: us-east-1

    # 3. Instala OpenTofu en el servidor de GitHub
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.8.8

    # 4. Inicializa OpenTofu (leerá el backend S3 en AWS automáticamente)
    - name: OpenTofu Init
      run: tofu init

    # 5. Muestra qué cambios se van a realizar (Simulación)
    - name: OpenTofu Plan
      run: tofu plan

    # 6. Aplica los cambios automáticamente en AWS de forma gratuita
    - name: OpenTofu Apply
      run: tofu apply -auto-approve